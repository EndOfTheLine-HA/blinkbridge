services:
  blinkbridge:
    build: .
    image: blinkbridge-local
    restart: unless-stopped
    volumes:
      - ./config:/config
    tmpfs:
      - /working:size=64m,mode=0700
    tty: true
    environment:
      BLINKBRIDGE_CONFIG: /config/config.json
      BLINK_USERNAME: ${BLINK_USERNAME:-}
      BLINK_PASSWORD: ${BLINK_PASSWORD:-}
    depends_on:
      - mediamtx

  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    restart: unless-stopped
    ports:
      # Loopback-only by default. Set BLINKBRIDGE_RTSP_BIND deliberately if
      # another host must read the streams, and protect that exposure.
      - "${BLINKBRIDGE_RTSP_BIND:-127.0.0.1}:8554:8554"
